name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check format
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Install Wild linker
        uses: wild-linker/action@latest

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libasound2-dev libudev-dev libwayland-dev libx11-dev pkg-config

      - name: Clippy (native)
        run: cargo clippy --locked --package personal-page --package game-server --package game-common --package xtask --all-targets --profile ci -- -D warnings

      - name: Clippy (WASM)
        run: cargo clippy --locked --package game-client --package game-common --target wasm32-unknown-unknown --profile ci -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install Wild linker
        uses: wild-linker/action@latest

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libasound2-dev libudev-dev libwayland-dev libx11-dev pkg-config

      - name: Test (native)
        run: cargo test --locked --package personal-page --package game-server --package game-common --package xtask --profile ci

      - name: Test (WASM - game-common)
        run: cargo test --locked --package game-common --target wasm32-unknown-unknown --profile ci

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install Wild linker
        uses: wild-linker/action@latest

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libasound2-dev libudev-dev libwayland-dev libx11-dev pkg-config

      - name: Install binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install wasm-pack
        run: cargo binstall wasm-pack -y

      - name: Build WASM client
        run: cd crates/game/client && wasm-pack build --target web --out-dir ../../../assets/game/pkg

      - name: Check (native packages)
        run: cargo check --locked --package personal-page --package game-server --package game-common --package xtask --profile ci

      - name: Check (WASM game-common)
        run: cargo check --locked --package game-common --target wasm32-unknown-unknown --profile ci

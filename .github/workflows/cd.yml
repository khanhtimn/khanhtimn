name: CD

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io

jobs:
  push-web:
    name: Build & Push Web Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: khanhtimn
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for personal-page
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/khanhtimn/personal-page
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Expose GitHub Actions cache env
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build and push personal-page Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}

  push-game-server:
    name: Build & Push Game Server Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: khanhtimn
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for game-server
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/khanhtimn/game-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Expose GitHub Actions cache env
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build and push game-server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.game-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
